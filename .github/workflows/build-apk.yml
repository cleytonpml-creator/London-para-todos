name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK com Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o Codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Dependencias
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force

      - name: 4. Compilar React (Vite)
        run: npm run build

      - name: 5. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Adicionar e Sincronizar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 8. Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: London-Frota-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
