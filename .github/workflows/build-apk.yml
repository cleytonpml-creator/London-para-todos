name: Gerar APK do Site

on:
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o código
      uses: actions/checkout@v4

    - name: Configurando o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar o Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Gerar APK de teste rápido
      run: |
        # Cria uma configuração genérica para envelopar o index.html atual
        mkdir -p android-build
        echo '{"appVersion": "1.0.0", "gcmSenderId": "12345"}' > android-build/twa-manifest.json
        # Comando para compilar o APK básico usando a estrutura web
        # Nota: Caso use um framework específico, adaptamos aqui.
        
    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-site-apk
        path: "**/app-release-unsigned.apk" # Busca qualquer APK gerado na pasta
